<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convertisseur de Température</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Convertisseur de Température</h1>

        <div class="form">
            <div>
                <label for="celcius">Celcius:</label>
                <input type="number" name="celcius" id="celcius" placeholder="Entrer la Température">
            </div>
            <div>
                <label for="fahrenheit">Fahrenheit:</label>
                <input type="number" name="fahrenheit" id="fahrenheit" placeholder="Entrer la Température">
            </div>
            <div>
                <label for="kelvin">Kelvin:</label>
                <input type="number" name="kelvin" id="kelvin" placeholder="Entrer la Température">
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
